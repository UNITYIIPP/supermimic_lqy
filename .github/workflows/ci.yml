name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

env:
  UV_FROZEN: "1"
  MUJOCO_GL: disable

jobs:
  lint-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run lint
        run: uvx ruff@0.15.0 check --diff src/
      - name: Run format
        run: uvx ruff@0.15.0 format --diff src/
